# goal : create a workflow to linting, building, pushing to docker and testing
name: ci

on: 
  push:
    branches: [advanced]

jobs:
  frontend:
    # git runner
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install packages
        run: npm install
        working-directory: frontend

      - name: run linting
        run: npm run lint
        working-directory: frontend

      - name: run test
        run: npm run test
        working-directory: frontend
